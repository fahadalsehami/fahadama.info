<!doctype html>
<html lang="en" data-theme="light" data-mode="starlight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fahad Alsehami</title>
  <meta name="description" content="Fahad Alsehami is a serial entrepreneur: founder of Medera, the AI co-therapy OS for behavioral health, and co-founder of BOTIM.">
  <meta name="author" content="Fahad Alsehami">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#050508">

  <link rel="canonical" href="https://fahadama.info/">

  <!-- Sharing previews. Link previews need full URLs, so these name the live domain. -->
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://fahadama.info/">
  <meta property="og:title" content="Fahad Alsehami">
  <meta property="og:description" content="Serial entrepreneur. Founder of Medera and co-founder of BOTIM.">
  <meta property="og:image" content="https://fahadama.info/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <script>
    /* Theme and starlight are decided before the first paint, so nothing flashes.
       Every visit opens in starlight; "Turn the lights on" shows the lit site.
       Add ?lights=on to a link to skip starlight. */
    (function () {
      var root = document.documentElement, theme, lit;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", theme);
      try { lit = sessionStorage.getItem("lights") === "on"; } catch (e) {}
      if (/[?&]lights=on\b/.test(location.search)) lit = true;
      root.setAttribute("data-mode", lit ? "lit" : "starlight");
      root.classList.add("js");
      if (location.protocol.indexOf("http") === 0) {
        ["newsreader", "geist-mono"].forEach(function (f) {
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
          l.href = "assets/fonts/" + f + ".woff2";
          document.head.appendChild(l);
        });
      }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <canvas class="starfield" aria-hidden="true"></canvas>
  <div class="light-pool" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page">
    <header class="top">
      <button type="button" class="portrait" aria-label="Portrait of Fahad Alsehami. Switch between light and dark theme.">
        <span class="portrait-disc">
          <img class="portrait-img" src="content/images/portrait.webp" width="560" height="560" alt="" fetchpriority="high">
        </span>
        <canvas class="portrait-particles" aria-hidden="true"></canvas>
      </button>

      <div class="controls">
        <span class="controls-label" aria-hidden="true">Starlight</span>
        <button type="button" class="control control-star" aria-label="Turn the lights on and show the site">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1.6"/><circle cx="6.5" cy="8" r="1"/><circle cx="17.5" cy="7" r="1.2"/><circle cx="8" cy="16.5" r="1.1"/><circle cx="16.5" cy="16" r="0.9"/><circle cx="12" cy="5" r="0.7"/><circle cx="19" cy="12.5" r="0.7"/><circle cx="5" cy="12.5" r="0.7"/><circle cx="12" cy="19" r="0.8"/></svg>
        </button>
        <button type="button" class="control control-theme" aria-label="Switch to dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 4.75a7.25 7.25 0 0 1 0 14.5Z"/></svg>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section class="hero" aria-labelledby="greeting">
        <h1 id="greeting" data-bind="greeting">Hello! I’m Fahad</h1>
        <p class="intro" data-bind="intro">I’m a serial entrepreneur and product builder working where AI meets behavioral health.</p>
      </section>

      <div class="tabs" role="tablist" aria-label="Sections" data-slot="tabs"></div>
      <div class="panels" data-slot="panels"></div>

      <section class="contact" aria-labelledby="contact-title">
        <div class="contact-head">
          <h2 class="contact-title" id="contact-title"><span class="visually-hidden" data-bind="contactTitle">Say hello</span><canvas class="hello-canvas" aria-hidden="true"></canvas></h2>
          <p class="contact-note" data-bind="contactNote"></p>
        </div>
        <ul class="contact-list" data-slot="contact"></ul>
      </section>

      <noscript>
        <p class="noscript">Fahad Alsehami: serial entrepreneur, founder of <a href="https://www.medera.info">Medera</a> and co-founder of BOTIM. Writing at <a href="https://alsehami.substack.com">Signal &amp; Symptom</a>. Turn on JavaScript to see the full site.</p>
      </noscript>
    </main>

    <footer class="foot">
      <p class="foot-who"><span data-bind="name">Fahad Alsehami</span><span data-bind="location"></span></p>
      <a class="foot-top" href="#">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </div>

  <div class="sr-status visually-hidden" role="status" aria-live="polite"></div>

  <script src="content/site.js"></script>
  <script src="assets/js/particles.js"></script>
  <script src="assets/js/starfield.js"></script>
  <script src="assets/js/mini-ui.js"></script>
  <script src="assets/js/bookshelf.js"></script>
  <script src="assets/js/play.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
